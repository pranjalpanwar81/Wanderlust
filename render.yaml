# Render service manifest for Wanderlust
# Usage:
# 1) Commit this file and push to your repo (done by me).
# 2) In Render, create a new service and select "Create from a Render YAML file" or connect the repo and Render will auto-detect this file.
# 3) Add the required Environment Variables in the Render dashboard (ATLASDB_URL, SECRET, etc.).

services:
  - type: web
    name: Wanderlust
    env: node
    region: oregon
    branch: main
    repo: https://github.com/pranjalpanwar81/Wanderlust.git
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: ATLASDB_URL
        # leave value blank here and set it in the Render dashboard for security
        value: ""
      - key: SECRET
        value: ""
      - key: MAP_TOKEN
        value: ""
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_KEY
        value: ""
      - key: CLOUDINARY_SECRET
        value: ""
