[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ejs", "ejs-mate", "express", "mongoose", "passport-local-mongoose", "cloudinary", "multer-storage-cloudinary"]
  included_files = ["views/**", "public/**"]

# Everything that isn't a real file in /public goes to the Express app.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
